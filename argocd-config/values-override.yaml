# Overrides done by argocd-diff-preview
# These will happen after the values.yaml file is loaded
notifications:
  enabled: false
dex:
  enabled: false
configs:
  params:
    # Timeout for git requests from repo-server (fetch/clone). Increase for large repos.
    reposerver.git.request.timeout: "1000s"
    # Timeout for application-controller RPC calls to repo-server when generating manifests.
    # Default is 60s; large charts may need significantly more.
    controller.repo.server.timeout.seconds: "1000"
    # Timeout for argocd-server RPC calls to repo-server (used by CLI operations like `argocd app manifests`).
    server.repo.server.timeout.seconds: "1000"
# Readiness probe settings have been adjusted to start checks immediately (initialDelaySeconds: 0)
# The failureThreshold is increased to ensure the total time before a pod is marked unhealthy remains similar to the default
# This default duration is calculated using the original values from values.yaml for (initialDelaySeconds + failureThreshold * periodSeconds)
controller:
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 1
    successThreshold: 1
    timeoutSeconds: 1
    failureThreshold: 40
server:
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 1
    successThreshold: 1
    timeoutSeconds: 1
    failureThreshold: 40
repoServer:
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 1
    successThreshold: 1
    timeoutSeconds: 1
    failureThreshold: 40
  env:
  - name: ARGOCD_EXEC_TIMEOUT
    value: "1000s"
  - name: ARGOCD_EXEC_FATAL_TIMEOUT
    value: "1100s"
applicationSet:
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 1
    successThreshold: 1
    timeoutSeconds: 1
    failureThreshold: 40
